<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF-КОНВЕРТОР</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-file-pdf"></i> PDF-КОНВЕРТОР</h1>
                <p>Конвертируйте, редактируйте и объединяйте PDF в браузере</p>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="convert"><i class="fas fa-exchange-alt"></i> Конвертация</button>
            <button class="tab-btn" data-tab="edit"><i class="fas fa-pen-fancy"></i> Редактор</button>
            <button class="tab-btn" data-tab="merge"><i class="fas fa-object-group"></i> Объединение</button>
        </div>

        <div id="convert" class="tab-content active"></div>
        <div id="edit" class="tab-content"></div>
        <div id="merge" class="tab-content"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    
    <script type="module" src="js/app.js"></script>
</body>
</html>
