<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Конвертор</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1><i class="fas fa-file-pdf"></i> PDF Конвертор</h1>
            <p>Конвертируй, редактируй, объединяй</p>
        </header>

        <div class="tab-bar">
            <button class="tab-btn active" data-tab="convert"><i class="fas fa-arrow-right-arrow-left"></i> Конвертация</button>
            <button class="tab-btn" data-tab="edit"><i class="fas fa-pen"></i> Редактор</button>
            <button class="tab-btn" data-tab="merge"><i class="fas fa-layer-group"></i> Объединение</button>
        </div>

        <div id="convert" class="tab-content active"></div>
        <div id="edit" class="tab-content"></div>
        <div id="merge" class="tab-content"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
